<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LunchMate</title>
<meta name="theme-color" content="#FAF0CA">
<meta name="color-scheme" content="dark light">
<script>try{var __s=JSON.parse(localStorage.getItem('lunchmate.v1'));document.documentElement.setAttribute('data-theme',__s&&__s.theme==='dark'?'dark':'light');if(__s&&/^(aqua|rose|plum|sand)$/.test(__s.pal))document.documentElement.setAttribute('data-pal',__s.pal);if(__s&&__s.lang==='am')document.documentElement.setAttribute('lang','am');}catch(e){}</script>
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="hdr">
  <div class="h1">
    <button class="brand" data-act="themes" aria-label="Themes"><span class="dot"></span><span class="lbl">LunchMate</span></button>
    <div class="hr">
      <button id="lang" class="lang" data-act="lang" data-l="en" aria-label="Language">
        <span class="thumb"></span>
        <span class="fg" id="fl-en"></span>
        <span class="fg" id="fl-am"></span>
      </button>
      <button id="info" class="ib" data-act="info" aria-label="Information"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><path d="M12 7.6h.01" stroke-width="2.6"/></svg></button>
      <button id="theme" class="ib" data-act="theme" aria-label="Theme">
        <svg class="ic-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.6 8.6 0 019.8 3.5 8.6 8.6 0 1020.5 14.2z"/></svg>
      </button>
    </div>
  </div>
  <div id="bar"></div>
  <div id="tools"></div>
</header>
<div id="stage"></div>
<nav id="nav" data-i="0"><button class="tab on" data-act="mode" data-v="weekly" aria-label="Weekly"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M3.5 10h17M8 3v3.5M16 3v3.5M7.5 14.5h9"/></svg><span class="tl" data-i18n="weekly">Weekly</span></button><button class="tab" data-act="mode" data-v="monthly" aria-label="Monthly"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M3.5 10h17M8 3v3.5M16 3v3.5"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01M16 17h.01" stroke-width="2.4"/></svg><span class="tl" data-i18n="monthly">Monthly</span></button></nav>
<div id="selbar" class="off"></div>
<div id="sheet"><div class="panel" id="panel"></div></div>
<div id="sheet2"><div class="panel" id="panel2"></div></div>
<div id="toast"></div>
<div id="alert"></div>
<script src="app.js"></script>
</body>
</html>
